name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    uses: EggIncTools/EggIdentity/.github/workflows/build-identity.yml@main

  create-release:
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.identity.outputs.version }}
          target_commitish: ${{ needs.identity.outputs.sha }}
          name: v${{ needs.identity.outputs.version }}
          draft: true
          generate_release_notes: true

  nuget:
    needs: identity
    uses: EggIncTools/EggIdentity/.github/workflows/nuget-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      packages-auth: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
      pack-targets: |
        EggIncognito.Core/EggIncognito.Core.csproj
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  binaries:
    name: Binary (${{ matrix.rid }})
    needs: [identity, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    permissions:
      contents: write
      packages: read
    env:
      BUILD_HEIGHT: ${{ needs.identity.outputs.height }}
      BUILD_SHA: ${{ needs.identity.outputs.sha }}
      TAG: v${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "11.0.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build self-contained binary
        run: |
          RID="${{ matrix.rid }}"
          OUT="publish-${RID}"
          dotnet publish EggIncognito/EggIncognito.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:NoBrowser=true \
            -p:EmitTypes=false \
            -p:RunAnalyzers=false \
            -p:EnforceCodeStyleInBuild=false \
            -p:TreatWarningsAsErrors=false \
            -p:GenerateDocumentationFile=false \
            --output "$OUT"
          cp -r EggIncognito/Endpoints "$OUT/Endpoints"
          ARCHIVE="eggincognito-${TAG}-${RID}.tar.gz"
          [[ "$RID" == win-* ]] && ARCHIVE="eggincognito-${TAG}-${RID}.zip"
          if [[ "$RID" == win-* ]]; then
            (cd "$OUT" && zip -r "../$ARCHIVE" .)
          else
            tar -czf "$ARCHIVE" -C "$OUT" .
          fi
          rm -rf "$OUT"

      - name: Attach binary to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: eggincognito-*-${{ matrix.rid }}.*

      - name: Hash
        run: sha256sum eggincognito-*-${{ matrix.rid }}.* > "sha-${{ matrix.rid }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sha-${{ matrix.rid }}
          path: sha-${{ matrix.rid }}.sha256

  checksums:
    needs: [identity, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sha-*
          merge-multiple: true
          path: sums

      - run: cat sums/*.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ needs.identity.outputs.version }}
          draft: true
          files: SHA256SUMS

  publish-release:
    needs: [identity, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.identity.outputs.version }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest

  docker:
    needs: identity
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: app
      tags-mode: commit
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  notify-app:
    needs: [identity, nuget, docker]
    uses: EggIncTools/EggIdentity/.github/workflows/notify-deploy.yml@main
    with:
      app: eggincognito
      hook-url: https://id.egginc.tools
      digest: ${{ needs.docker.outputs.digest }}
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: ${{ needs.nuget.outputs.packages }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
