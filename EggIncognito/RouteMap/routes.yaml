excluded:
  - ei/kb

missing_endpoints:
  - ei/has_voted
  - ei/shell_showcase_view_poll
  - ei/confirm_gift_delivery
  - ei_srv/sub_change_hint
  - ei_ctx/mark_evaluation_read

needs_capture:
  # Endpoints whose transport shape is not fully known yet. To resolve: capture live
  # traffic that EXERCISES each path (the action that triggers the request), then replay
  # the HAR through the Seeder. The Seeder detects the inner types from the capture.
  #
  # request_unknown: response type is verified (real endpoint on disk), but the inner
  # REQUEST type is a signed AuthenticatedMessage we have never decoded. Capture the
  # client action that sends the request.
  request_unknown:
    - ei/get_events # response: EggIncCurrentEvents

  # fully_unknown: neither request nor response inner type is known. Both sides are
  # AuthenticatedMessage-wrapped and uncaptured. Capture exercises these to resolve both.
  fully_unknown:
    - ei/confirm_royalty_delivery
    - ei/showcase_listing_info
    - ei/showcase_vote

endpoint_status:
  # Auto-generated by Check-Endpoints.ps1 - do not edit by hand
  # Endpoints present but contain only default values - needs capture
  empty:
    - ei/contract_sim_poll
    - ei/did_config_change
    - ei/get_sales
    - ei/sync_path_of_virtue
    - ei/update_coop_status
    - ei_afx/launch_mission
    - ei_afx/set_artifact
    - ei_data/log_purchase
